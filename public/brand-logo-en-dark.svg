<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" fill="none">
  <defs>
    <linearGradient id="goldDarkGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E1" />
      <stop offset="35%" stop-color="#DFBA7F" />
      <stop offset="70%" stop-color="#C9A063" />
      <stop offset="100%" stop-color="#9E7432" />
    </linearGradient>
    <linearGradient id="emblemGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" />
      <stop offset="50%" stop-color="#DFBA7F" />
      <stop offset="100%" stop-color="#A57A33" />
    </linearGradient>
    <filter id="glowEn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem: Islamic Geometric 8-pointed star & Noor light core -->
  <g transform="translate(28, 26)">
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="none" stroke="url(#emblemGradEn)" stroke-width="1.6" opacity="0.9" filter="url(#glowEn)"/>
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="none" stroke="url(#emblemGradEn)" stroke-width="1.6" transform="rotate(45)" opacity="0.9"/>
    <rect x="-7.5" y="-7.5" width="15" height="15" rx="1.5" fill="url(#emblemGradEn)" opacity="0.85" transform="rotate(22.5)"/>
    <circle cx="0" cy="0" r="2.8" fill="#FFFBEB"/>
  </g>

  <!-- English Typography -->
  <g text-anchor="start">
    <text x="52" y="26" font-family="'Cinzel', 'Trajan Pro', 'Cormorant Garamond', serif" font-size="16" font-weight="700" fill="url(#goldDarkGradEn)" letter-spacing="2">
      NAFIS NOOR
    </text>
    <text x="53" y="40" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="8" font-weight="600" fill="#DFBA7F" opacity="0.85" letter-spacing="1.5">
      ISLAMIC AI COMPANION
    </text>
  </g>
</svg>
